name: Build Kivy APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 设置 Python 3.12.10（用于运行 Buildozer 本身）
    - name: Set up Python 3.12.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.10'

    # 2. 修复并更新 apt 源（关键步骤，解决 exit code 100）
    - name: Fix apt sources and update
      run: |
        # 允许接受仓库 Suite 标签的变更（例如 stable -> oldstable）
        sudo apt-get --allow-releaseinfo-change update || true
        # 如果上面的命令失败，尝试更换为镜像源（备用方案）
        # sudo sed -i 's|http://archive.ubuntu.com|https://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
        # sudo apt-get --allow-releaseinfo-change update

    # 3. 安装 Buildozer 所需的系统依赖
    - name: Install system dependencies
      run: |
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev

    # 4. 安装 Buildozer 和 Cython
    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        # 锁定 Cython < 3.0.0，避免破坏 Kivy/Pygame 的构建[reference:3]
        pip install "cython<3.0.0" buildozer

    # 5. 执行 Buildozer 构建（带有重试机制）
    - name: Build APK with Buildozer
      uses: nick-invision/retry@v3
      with:
        timeout_minutes: 60
        max_attempts: 3
        retry_on: error
        command: buildozer android debug

    # 6. 上传 APK
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
